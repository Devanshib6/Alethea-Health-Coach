services:
  - type: web
    name: alethea-backend-fyp
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        value: https://cdjbiyryvkckzwblduij.supabase.co
      - key: SUPABASE_KEY
        value: your-anon-key
      - key: DATABASE_URL
        value: your-database-url
      - key: SECRET_KEY
        value: alethea-super-secret-key-2024
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30